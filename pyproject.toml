[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501", # Line length (preserve existing functional layout)
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
files = [
    "backend",
    "capture",
    "config",
    "database",
    "detection",
    "logs",
    "ml",
    "main.py",
]

[[tool.mypy.overrides]]
module = [
    "scapy.*",
    "joblib.*",
    "sklearn.*",
    "pandas.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
omit = [
    "tests/*",
    "ml/data/*",
]
