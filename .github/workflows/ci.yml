name: SentinelX CI & Quality Gates

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality & Typing (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linting and typing tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff checks
        run: |
          ruff check .

      - name: Run Mypy static type analysis
        run: |
          mypy

      - name: Check generated config reference is current
        run: |
          python scripts/gen_config_docs.py --check

  security-audit:
    name: Security & Dependency Audit (Bandit & Pip-Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Bandit static application security testing
        run: |
          bandit -c bandit.yaml -r backend capture config database detection eval logs ml scripts main.py

      - name: Run Pip-audit dependency vulnerability scan
        run: |
          pip-audit -r requirements.txt

  test-regression:
    name: Automated Regression Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite with durations and coverage gate
        run: |
          pytest -v --durations=10 --cov --cov-fail-under=82

  detection-benchmark:
    name: Detection Benchmark (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run detection evaluation benchmark
        run: |
          python main.py eval --scenarios all --out eval_output

      - name: ML code-path smoke (tiny model on Phase 4 scenario flows; no accuracy claim)
        env:
          SENTINELX_MODEL_KEY: ci-only-throwaway-key-not-a-secret-0001
        run: |
          python scripts/build_flows.py --from-scenarios benign_web_browsing,benign_lan_noise,fast_vertical_scan,horizontal_sweep,slow_scan,syn_flood_spoofed --out ci_flows.csv.gz
          python main.py train --flows ci_flows.csv.gz --out ci_models --smoke
          python scripts/gen_ml_report.py --train ci_models/train_report.json --meta ci_flows.csv.gz.meta.json --out eval_output/ml_smoke_report.md --dataset-doc ""

      - name: Publish benchmark report to Step Summary
        if: always()
        run: |
          if [ -f eval_output/report.md ]; then
            cat eval_output/report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload evaluation output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-benchmark-report
          path: eval_output/

  api-fuzz:
    name: API Fuzzing (Schemathesis)
    runs-on: ubuntu-latest
    env:
      SENTINELX_DATA_DIR: ${{ github.workspace }}/fuzz-data
      SENTINELX_API_PORT: "5060"
      SENTINELX_RATE_LIMIT: "1000000"
      SENTINELX_LOGIN_RATE_LIMIT: "1000000"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Seed alerts, create admin and an analyst API key
        run: |
          python -c "from eval.scenarios import write_scenario_files; write_scenario_files('mixed', 'fuzz-data/pcap')"
          python main.py replay fuzz-data/pcap/mixed.pcap
          python - <<'EOF' > fuzz-data/analyst.key
          from database.app_db import initialize_app_database
          initialize_app_database()
          from backend import accounts
          accounts.create_user("fuzz-admin", "ci only fuzz admin passphrase", "admin")
          print(accounts.create_api_key("fuzz", "analyst")[1])
          EOF

      - name: Start the API (waitress)
        run: |
          nohup python main.py api > fuzz-data/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5060/health && break; sleep 1; done

      - name: Fuzz every endpoint with an analyst API key
        # positive_data_acceptance is excluded on purpose: IP/CIDR, timezone-aware timestamps and "assignee must
        # be an existing user" are validated more strictly than JSON Schema can express. The SSE stream is
        # excluded because it never ends; it is covered by tests/test_phase6c_api.py.
        run: |
          schemathesis run docs/openapi.yaml --url http://127.0.0.1:5060 \
            -H "Authorization: Bearer $(cat fuzz-data/analyst.key)" \
            --exclude-path /api/v1/stream --exclude-checks positive_data_acceptance --max-examples 100

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  container-scan:
    name: Container Scan (Trivy, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, sensor]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --target ${{ matrix.target }} -t sentinelx-${{ matrix.target }}:ci .

      - name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinelx-${{ matrix.target }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  compose-integration:
    name: Compose Integration + ZAP Baseline
    runs-on: ubuntu-latest
    env:
      CI_ADMIN_PASSWORD: ci only compose admin passphrase 9
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Create the admin, then start the stack
        run: |
          docker compose run --rm -T api python -c "
          from database.app_db import initialize_app_database
          initialize_app_database()
          from backend import accounts
          accounts.create_user('ci-admin', '$CI_ADMIN_PASSWORD', 'admin')"
          docker compose up -d --wait

      - name: Replay a Phase 4 scenario inside the sensor
        run: |
          docker compose exec -T sensor sh -c "python -c \"from eval.scenarios import write_scenario_files; write_scenario_files('fast_vertical_scan', '/tmp/scenario')\" && python main.py replay /tmp/scenario/fast_vertical_scan.pcap"

      - name: Call the API with an analyst key, triage one alert, assert the audit row
        run: |
          KEY=$(docker compose exec -T api python -c "from backend import accounts; print(accounts.create_api_key('ci-analyst', 'analyst')[1])" | tr -d '\r')
          python scripts/ci_compose_check.py --base http://127.0.0.1:5000 --key "$KEY" \
            --admin-user ci-admin --admin-password "$CI_ADMIN_PASSWORD"

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:5000
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: false

      - name: Fail on unjustified medium or higher ZAP alerts
        run: python scripts/zap_gate.py report_json.json .zap/rules.tsv

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    name: Browser Tests (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Run browser tests (seeded database, axe-core from tests/e2e/vendor)
        run: pytest -m e2e tests/e2e -q -p no:cacheprovider

  quality-gate:
    name: Quality Gate Summary
    needs: [code-quality, security-audit, test-regression, detection-benchmark, api-fuzz, secret-scan, container-scan, compose-integration, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Quality Gate Status
        run: |
          echo "All SentinelX automated quality gates (linting, typing, security, dependency audit, test regression, and detection benchmark) completed successfully."
