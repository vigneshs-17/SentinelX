<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>SentinelX</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script type="module" src="/static/js/main.js"></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar" id="topbar" hidden>
        <a class="brand" href="#/overview" aria-label="SentinelX home">SentinelX</a>
        <nav class="nav" id="nav" aria-label="Primary"></nav>
        <div class="topbar-right">
            <span class="status-pill" id="stream-status" role="status" aria-live="off" data-state="connecting">Connecting</span>
            <button class="btn btn-ghost" id="theme-toggle" type="button" aria-pressed="false">Dark</button>
            <span class="whoami" id="whoami"></span>
            <button class="btn btn-ghost" id="logout" type="button">Sign out</button>
        </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
    <div id="overlay-root"></div>
    <noscript><p class="noscript">The SentinelX console needs JavaScript.</p></noscript>
</body>
</html>
